# @package _global_

# R-VLFM: Relational Vision-Language Frontier Maps
# Config for zero-shot evaluation on HM3D ObjectNav
#
# Usage:
#   python -m vlfm.run --config-name r_vlfm_objectnav_hm3d
#
# Before running, launch the R-VLFM model servers:
#   ./scripts/launch_r_vlfm_servers.sh
#
# Environment variables:
#   QWENVL_PORT      — port for Qwen2-VL server   (default: 12190)
#   GDINO_PORT       — port for GroundingDINO      (default: 12181)
#   SAM_PORT         — port for MobileSAM          (default: 12183)
#   YOLO_PORT        — port for YOLOv7             (default: 12184)

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
    - frontier_exploration_map
    - traveled_stairs
  - /habitat_baselines/rl/policy: vlfm_policy
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False

  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"

  # R-VLFM uses the same trainer as VLFM
  trainer_name: "vlfm"

  num_updates: 270000
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: True

  eval:
    split: "val"

  rl:
    policy:
      # ── Swap this line vs. VLFM ──────────────────────────────────────────
      # VLFM original:  name: "HabitatITMPolicyV2"
      # R-VLFM:
      name: "HabitatRVLFMPolicy"
      # ─────────────────────────────────────────────────────────────────────

      # R-VLFM specific: port for the Qwen2-VL-2B server
      # Override with env var QWENVL_PORT if needed
      qwenvl_port: 12190

      # Stage-2 settings (can override here or in r_vlfm_policy.py constants)
      # top_k_verify: 3          # how many Stage-1 frontiers to re-verify
      # stage1_weight: 0.4       # blend weight for Stage-1 score
      # stage2_weight: 0.6       # blend weight for Stage-2 score
      # stage1_min_score: 0.20   # minimum Stage-1 score to enter Stage-2

    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50
      use_normalized_advantage: False
      hidden_size: 512

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      pretrained: False
      pretrained_encoder: False
      train_encoder: True
      reset_critic: False
      backbone: resnet50
      rnn_type: LSTM
      num_recurrent_layers: 2
